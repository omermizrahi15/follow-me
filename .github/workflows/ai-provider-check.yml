name: AI provider model check

# Daily check that the vision models classify-photos depends on still exist.
# Groq retired the one we used and photo grading failed for 2.5 weeks behind the
# Gemini fallback with nothing alerting anyone (issue #202). Spends no photo
# quota: it only lists each provider's models. Add GROQ_API_KEY and
# GEMINI_API_KEY as repo secrets (the same keys the Edge Function uses); a
# missing key fails the run on purpose, because a silent skip is the original bug.
on:
  schedule:
    - cron: '17 6 * * *' # daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only; do not file or close issues
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check provider models
        run: node .github/scripts/ai-provider-check.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
