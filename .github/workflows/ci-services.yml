name: CI · services

# Per-service CI for the Supabase Edge Functions (Deno). Only the functions you
# touched are tested, each in its own matrix job. A change under _shared/ fans
# out to every function, since they all depend on it.
#
# src/** is a trigger because the functions import the app's dual-runtime
# modules directly (issue #117) — editing photoSelection.ts IS editing every
# service. changed-functions.sh decides which src changes actually matter; when
# none do (the common case, a UI edit), the matrix falls back to a single
# _shared job so this workflow always reports a result instead of skipping.
on:
  pull_request:
    paths: ['supabase/functions/**', 'src/**', 'deno.json']
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'src/**', 'deno.json']

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      # No function changed? Fall back to a `_shared`-only job rather than an
      # empty matrix. An empty matrix leaves an unexpandable, permanently
      # "skipping" check on the PR (named after the raw `matrix.fn`
      # expression, since there is no matrix to resolve it from); the fallback
      # reports a real result, and _shared holds the tests for the
      # dual-runtime src/ modules, so it is the right thing to run anyway.
      matrix: ${{ steps.detect.outputs.any == 'true' && steps.detect.outputs.matrix || '{"fn":["_shared"]}' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: bash scripts/changed-functions.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  test:
    name: ${{ matrix.fn }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      # Every service is tested together with _shared; the _shared fallback job
      # names it once.
      DIRS: >-
        supabase/functions/${{ matrix.fn }}/
        ${{ matrix.fn != '_shared' && 'supabase/functions/_shared/' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Cache remote deps (esm.sh, jsr) keyed on deno.lock — otherwise every
          # matrix job cold-downloads them, and a CDN hiccup (e.g. an esm.sh 522)
          # fails CI spuriously.
          cache: true
      - name: Lint
        run: deno lint $DIRS
      - name: Typecheck
        # _shared is a library, not a service: no entrypoint to check. Its
        # types are covered by the check of every service that imports it.
        if: matrix.fn != '_shared'
        run: deno check "supabase/functions/${{ matrix.fn }}/index.ts"
      - name: Test (service + shared)
        run: deno test $DIRS
