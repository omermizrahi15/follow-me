name: CI · app

# App CI (Node/Jest). Scoped to app code so a service-only change doesn't drag
# the whole app suite. `_shared/**` is included because the app's parity tests
# (e.g. photoSelectionParity) assert the app logic matches the Deno copies.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.json'
      - 'jest.setup.ts'
      - 'tsconfig.json'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/ci.yml'
  # No paths filter, unlike the push trigger above: main requires `validate` on
  # every pull request, and a required check that does not run is not a skipped
  # check — GitHub waits for a report that never comes and the PR sits in BLOCKED
  # for good. A workflow-only or docs-only change was unmergeable until this.
  # The suite is a couple of minutes; a PR that cannot merge costs far more.
  pull_request:
    branches: [main]

jobs:
  # Named `validate`, not something prettier: main's branch protection requires a
  # status check by that exact name, and GitHub matches on the job's display
  # name. Renaming this job silently un-protects main — every PR then reports a
  # context nothing requires, and the required one never arrives at all.
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validate
        run: npm run validate
