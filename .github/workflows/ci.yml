name: CI · app

# App CI (Node/Jest). Scoped to app code so a service-only change doesn't drag
# the whole app suite. `_shared/**` is included because the app's parity tests
# (e.g. photoSelectionParity) assert the app logic matches the Deno copies.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.json'
      - 'jest.setup.ts'
      - 'tsconfig.json'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.json'
      - 'jest.setup.ts'
      - 'tsconfig.json'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/ci.yml'

jobs:
  validate:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validate
        run: npm run validate
