name: CD · app (EAS OTA)

# CD for the mobile app (the JS bundle), independent of the services. On merge
# to main it ships an EAS Update (OTA) to the staging channel; installed staging
# builds pick it up with no rebuild. Promote to production via "Run workflow".
#
# Native/dependency changes can't ride an OTA. The last step asks EAS whether any
# installed build actually shares this update's fingerprint runtimeVersion — if
# none does, the update reached nobody, so on staging a fresh `eas build` starts
# automatically and the job waits for it, then links a QR to install it. The run
# only goes RED when no build could be started or the one that ran failed;
# "built, waiting for you to tap Install" is green.
#
# Runs are serialised by the concurrency group below, so merges deploy strictly
# in order and never overlap — including while one is waiting on a rebuild.
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'app.json', 'app.config.js', 'App.js', 'package.json']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-app-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  ota-update:
    name: EAS Update → ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          # Ranged, not `latest`: eas-cli 22 renamed fields in `build:list --json`
          # and `latest` walked into it between two merges, so the rebuild check
          # read every build as incompatible and started builds nobody needed.
          # Patches and minors still arrive; a major is now a deliberate edit.
          eas-version: ^22.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Resolve channel + bundle-time env
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          PROFILE=$([ "$ENV" = "production" ] && echo production || echo preview)
          echo "CHANNEL=$ENV" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          # The EXPO_PUBLIC_* vars are read at bundle time — load them from the
          # matching eas.json profile so there is no second copy to maintain.
          node -e "const e=require('./eas.json').build['$PROFILE'].env; for (const [k,v] of Object.entries(e)) console.log(k+'='+v)" >> "$GITHUB_ENV"
      - name: Publish OTA update
        # Pass the message via env, never interpolated into the run line, so a
        # commit message with quotes/newlines can't break or inject the shell.
        env:
          UPDATE_MSG: ${{ github.event.head_commit.message || format('manual → {0}', github.event.inputs.environment) }}
        # --platform ios: the app is iOS-only (app.json platforms) and the
        # default (all platforms) fails exporting the nonexistent android bundle.
        #
        # --environment is load-bearing, not decoration. runtimeVersion is the
        # fingerprint policy, and app.config.js feeds SENTRY_ORG/SENTRY_PROJECT
        # into the Sentry plugin — those live in EAS's server-side environment,
        # which `eas build` loads and `eas update` does NOT unless asked. Without
        # it every update was tagged 1b8041df… while every build carried
        # e5a59d02…, so no OTA could reach any device and the rebuild check below
        # fired on every merge. The profile names match the environment names
        # (preview/production), so $PROFILE is the right value.
        #
        # --json (stdout only; progress goes to stderr) so the runtimeVersion the
        # update was actually tagged with can be read back instead of recomputed.
        # Written to RUNNER_TEMP, not the repo: the rebuild step below may run
        # `eas build`, which refuses to package a dirty working tree.
        run: |
          eas update --branch "$CHANNEL" --message "$UPDATE_MSG" --platform ios \
            --environment "$PROFILE" --json --non-interactive > "$RUNNER_TEMP/update.json"
          node -e "
            const fs = require('fs');
            // eas-cli prints the 'Environment variables ... loaded' notice to
            // STDOUT even under --json, so start at the first JSON delimiter.
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/update.json', 'utf8');
            const at = raw.search(/[[{]/);
            if (at < 0) throw new Error('no JSON in eas update output: ' + raw.slice(0, 200));
            const groups = JSON.parse(raw.slice(at));
            // eas-cli 22 renamed this field on build payloads (runtimeVersion →
            // runtime.version); read both here so an update payload following
            // suit can't take the deploy down.
            const rv = (Array.isArray(groups) ? groups : [groups])
              .map((u) => u.runtimeVersion ?? u.runtime?.version)
              .find(Boolean);
            if (!rv) throw new Error('no runtimeVersion in eas update output');
            console.log('RUNTIME_VERSION=' + rv);
          " >> "$GITHUB_ENV"
      - name: Upload source maps to Sentry
        # OTA bundles replace the JS that shipped in the binary, so crash stack
        # traces stay readable only if the maps for THIS update reach Sentry
        # (`eas update` leaves the export in dist/). Skips with a notice until
        # the Sentry secrets are configured — never fails the deploy.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN not configured — skipping Sentry source map upload"
            exit 0
          fi
          npx sentry-expo-upload-sourcemaps dist
      - name: Did this OTA reach any device?
        # Last step on purpose: it can fail the job, and everything above (the
        # update itself, source maps) is still worth doing when it does. Staging
        # auto-starts the rebuild; production only reports, so a production build
        # is never spent without asking.
        # CHANNEL, PROFILE and RUNTIME_VERSION are already in the environment —
        # the steps above wrote them to $GITHUB_ENV.
        env:
          MODE: cd
          AUTO_BUILD: ${{ (github.event.inputs.environment || 'staging') == 'staging' && '1' || '0' }}
        run: node .github/scripts/ota-rebuild-check.mjs
