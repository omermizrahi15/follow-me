name: CD · database (migrations)

# CD for database migrations, independent of app and services. On merge to main
# it applies pending migrations to STAGING. Production migrations are applied
# only by explicit promotion via "Run workflow" (guarded by the `production`
# environment) — never automatically.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/deploy-db.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      include_all:
        description: >-
          Also apply migrations that sort BELOW the remote's newest one. Needed
          only to adopt an environment whose early schema was created by hand,
          so the ledger has gaps. Every skipped migration then runs, so check
          they are all idempotent first.
        type: boolean
        default: false

concurrency:
  group: deploy-db-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # A migration's version is its numeric prefix, and `supabase db push` refuses
  # to apply one that sorts at or below what the remote has already run. Two
  # branches opened at the same time naturally pick the same next number, so the
  # collision only appears once both are merged — on main, in CD, after the fact.
  # Catching it on the PR is the whole point of this job.
  check:
    name: Check migration order
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versions are unique and sort after the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version() { basename "$1" | cut -d_ -f1; }

          dupes=$(for f in supabase/migrations/*.sql; do version "$f"; done | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two migrations share a version prefix: $(echo $dupes | tr '\n' ' ')"
            echo "Renumber the one that has not been applied yet."
            exit 1
          fi

          git fetch --no-tags origin "$BASE"
          base_max=$(git ls-tree --name-only "origin/$BASE" supabase/migrations/ \
            | sed -n 's|.*/\([0-9]*\)_.*|\1|p' | sort | tail -1)
          # -M so a renumbering reads as a rename, not an addition: renumbering a
          # migration the remote has not run yet is the fix for this error, and
          # the new number is legitimately below the newest one on the branch.
          added=$(git diff -M --name-only --diff-filter=A "origin/$BASE...HEAD" -- 'supabase/migrations/*.sql')
          status=0
          for f in $added; do
            v=$(version "$f")
            if [ "$v" -le "$base_max" ]; then
              echo "::error file=$f::$v does not sort after $base_max, the newest migration on $BASE. Renumber it."
              status=1
            fi
          done
          exit $status

  # Static name: `github.event.inputs` is null on a pull_request, and a job name
  # is resolved early enough that the fallback does not save it — the checks list
  # showed the unrendered `${{ ... }}` instead. The target is on the run's
  # environment badge and echoed by the step below.
  migrate:
    name: Migrate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          FLAGS=""
          [ "${{ github.event.inputs.include_all }}" = "true" ] && FLAGS="--include-all"
          if [ "$ENV" = "production" ]; then
            supabase db push $FLAGS --db-url "${{ secrets.PROD_DB_URL }}"
          else
            supabase db push $FLAGS --db-url "${{ secrets.STAGING_DB_URL }}"
          fi
