name: Deploy staging

# Continuous deployment to STAGING on every merge to main. Staging is the
# always-safe pre-production mirror, so this runs automatically. Production is a
# separate, manually-promoted workflow (deploy-production.yml).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - '.github/workflows/deploy-staging.yml'

# Never let two staging deploys race on the same DB / channel.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_REF: xszvrvnxduwpymyabvcg

jobs:
  backend:
    name: DB migrations + Edge Functions → staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push database migrations
        run: supabase db push --db-url "${{ secrets.STAGING_DB_URL }}"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/deploy-functions.sh "$STAGING_REF"

  ota-update:
    name: EAS Update (staging channel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Bundle the JS with the staging profile's EXPO_PUBLIC_* vars baked in
      # (they are read at bundle time), sourced straight from eas.json so there
      # is no second copy to keep in sync.
      - name: Load staging env from eas.json
        run: node -e "const e=require('./eas.json').build.preview.env; for (const [k,v] of Object.entries(e)) console.log(k+'='+v)" >> "$GITHUB_ENV"
      - name: Publish OTA update
        run: eas update --branch staging --message "${{ github.event.head_commit.message }}" --non-interactive
