name: PR preview (EAS Update + QR)

# Publishes each PR's JS as an EAS Update on its own branch (pr-<number>) and
# comments a QR code that opens it on your phone, so a PR can be looked at
# without checking out the branch or waiting for a merge to staging.
#
# Runs inside the "Follow Me (PR)" development build (eas.json → pr-preview),
# installed once. It uses the staging backend. A PR that changes native code or
# dependencies changes the fingerprint runtimeVersion, so the installed build
# won't accept its update — the comment says so instead of showing a dead QR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['src/**', 'assets/**', 'app.json', 'app.config.js', 'App.js', 'package.json', 'eas.json']

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Publish preview update
    # Fork PRs get no secrets, so there is nothing to publish with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: ^22.0.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Load bundle-time env from the pr-preview profile
        run: |
          node -e "const e=require('./eas.json').build['pr-preview'].env; for (const [k,v] of Object.entries(e)) console.log(k+'='+v)" >> "$GITHUB_ENV"
      - name: Publish update
        # --environment preview: the same server-side env (Sentry org/project) the
        # staging builds use, so the fingerprint matches the installed PR build.
        run: |
          eas update --branch "pr-$PR_NUMBER" --message "PR #$PR_NUMBER @ ${HEAD_SHA:0:7}" \
            --platform ios --environment preview --json --non-interactive > "$RUNNER_TEMP/update.json"
          node -e "
            const raw = require('fs').readFileSync(process.env.RUNNER_TEMP + '/update.json', 'utf8');
            const groups = JSON.parse(raw.slice(raw.search(/[[{]/)));
            const u = (Array.isArray(groups) ? groups : [groups])[0];
            const rv = u.runtimeVersion ?? u.runtime?.version;
            if (!u.group || !rv) throw new Error('no group/runtimeVersion in eas update output');
            console.log('GROUP_ID=' + u.group);
            console.log('RUNTIME_VERSION=' + rv);
          " >> "$GITHUB_ENV"
      - name: Comment QR on the PR
        run: |
          PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")
          node -e "
            const { previewLinks, renderComment } = require('./.github/scripts/prPreview.js');
            const links = previewLinks({ projectId: '$PROJECT_ID', groupId: process.env.GROUP_ID });
            process.stdout.write(renderComment({
              prNumber: Number(process.env.PR_NUMBER),
              sha: process.env.HEAD_SHA,
              links,
              runtimeVersion: process.env.RUNTIME_VERSION,
            }));
          " > "$RUNNER_TEMP/comment.md"
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- pr-preview -->"))][0].id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md"
          fi
