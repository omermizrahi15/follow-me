name: Sentry errors → GitHub issues

# Polls Sentry for unresolved `error` and `fatal` issues and opens a labeled bug
# issue for each new one. An issue that already exists has its counts refreshed
# in place, and is reopened with a comment if it fires again after it was closed
# — so a tracked issue never goes stale about whether it's still happening. Dedup
# is by a hidden `sentry-issue-id:<id>` marker in the issue body, so the cron
# and manual runs never double-file. See .github/scripts/sentry-to-issue.mjs.
on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be filed without creating issues
        type: boolean
        default: false
      stats_period:
        description: Sentry lookback window (only 24h or 14d are valid)
        type: string
        default: 14d
      levels:
        description: 'Comma-separated levels to file (default: error,fatal)'
        type: string
        default: 'error,fatal'
      match_regex:
        description: 'Optional title/culprit filter (default: match any at the given levels)'
        type: string
        default: ''

concurrency:
  group: sentry-to-issue
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  file-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: File GitHub issues for new Sentry errors
        run: node .github/scripts/sentry-to-issue.mjs
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # Dedicated read token (event:read + project:read). Falls back to the
          # release/upload token, which lacks event:read and will 403 — so add
          # SENTRY_ISSUES_TOKEN as a repo secret for this to work.
          SENTRY_ISSUES_TOKEN: ${{ secrets.SENTRY_ISSUES_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          STATS_PERIOD: ${{ inputs.stats_period || '14d' }}
          LEVELS: ${{ inputs.levels || 'error,fatal' }}
          MATCH_REGEX: ${{ inputs.match_regex || '' }}
