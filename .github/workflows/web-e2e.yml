name: Web E2E (subscribe page)

# The public subscribe page (docs/join/) is a static browser page the iOS app
# can't cover. This runs headless on Ubuntu in ~1-2 min, so — unlike the
# simulator suite — it's cheap enough to gate every PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-e2e:
    name: Playwright (subscribe page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web E2E
        run: npm run e2e:web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
