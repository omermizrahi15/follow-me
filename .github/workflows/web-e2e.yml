name: CI · e2e web (join page)

# The public subscribe page (docs/join/) is a static browser page the iOS app
# can't cover. This runs headless on Ubuntu in ~1-2 min. Path-filtered like
# every other pipeline: it only runs when the page or its tests change.
on:
  push:
    branches: [main]
    paths: ['docs/join/**', 'web-e2e/**', 'playwright.config.ts']
  pull_request:
    branches: [main]
    paths: ['docs/join/**', 'web-e2e/**', 'playwright.config.ts']

jobs:
  web-e2e:
    name: Playwright (subscribe page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web E2E
        run: npm run e2e:web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
