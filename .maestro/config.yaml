# Maestro workspace config — see docs/E2E.md for setup and usage.
flows:
  - "flows/*.yaml"

# Flows build on each other: sign-in leaves a persisted session that the later
# auth flows reuse, and sign-out tears it down, so order matters.
executionOrder:
  # Run every flow even if one fails, so CI reports all broken flows in a single
  # (expensive) build rather than stopping at the first.
  continueOnFailure: true
  flowsOrder:
    - onboarding
    - sign-in
    - navigation
    - edit-profile
    - add-post
    - auto-posting
    - followers
    - sign-out
