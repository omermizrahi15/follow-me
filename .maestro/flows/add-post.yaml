appId: com.urishiber.followme
name: add-post
tags:
  - auth
---
# Me page -> Add post opens the new-post chooser (suggested vs. manual), then
# the manual branch opens the New-post modal with the photo picker entry point.
# The suggested branch is deliberately only asserted, never tapped: it starts a
# device photo scan and a paid classification run. Stops before the iOS system
# photo picker (non-deterministic on a CI simulator with no photos) and closes
# the modal. Reuses the session from sign-in.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 15000
- tapOn:
    id: "home-add-post"
- extendedWaitUntil:
    visible:
      id: "new-post-manual"
    timeout: 10000
- assertVisible:
    id: "new-post-suggested"
- tapOn:
    id: "new-post-manual"
- extendedWaitUntil:
    visible:
      id: "upload-pick-photos"
    timeout: 10000
- assertVisible: "New post"
- tapOn:
    id: "upload-close"
- assertVisible:
    id: "home-add-post"
