appId: com.urishiber.followme
name: remove-cloud-photos
tags:
  - auth
---
# Settings → Privacy → "Remove my photos from the cloud" → confirm Delete.
# Reuses the session from sign-in.
#
# The control used to live at the bottom of the auto-posting section, where it
# read as a step in setting up posting rather than the privacy escape hatch it
# is — and where it was gated on "does the cloud hold anything", which is what
# issue #58 was really about. Routine cleanup is now automatic (copies that age
# out of the window are deleted after every sync), so this is only ever the
# deliberate "delete everything you hold of mine", and it stays reachable
# whether or not there is anything to delete.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 15000
- tapOn:
    id: "home-settings-button"
- assertVisible: "Privacy"
# Upload is on by default (issue #142) and its switch sits in this section,
# directly above the wipe. Two separate things on purpose: this one stops,
# the one below stops AND deletes.
- assertVisible:
    id: "settings-photo-sync-toggle"
- tapOn:
    id: "settings-remove-cloud-photos"
# Native confirm alert ("?" is a regex char in Maestro text matchers — use .*).
- assertVisible: "Remove your photos from the cloud.*"
- tapOn: "Delete"
# Server round-trip (delete-candidates edge function) → success alert, which
# states the consequence: upload is off until the publisher turns it back on.
- extendedWaitUntil:
    visible: "Deleted"
    timeout: 20000
- assertVisible: ".*Photo upload is now off.*"
- tapOn: "OK"
# And the auto-posting section says so, naming where to undo it. It reports the
# state rather than offering a second switch for it — the switch is the one in
# Settings this flow just walked past.
- tapOn:
    id: "section-nav-auto"
- extendedWaitUntil:
    visible:
      id: "photo-sync-status-title"
    timeout: 15000
- assertVisible: "Photo upload is off"
- assertVisible: ".*Settings . Privacy.*"
- tapOn:
    id: "section-nav-me"
