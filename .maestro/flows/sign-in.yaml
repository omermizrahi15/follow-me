appId: com.urishiber.followme
name: sign-in
tags:
  - auth
---
# Signs in with a Supabase *test OTP* phone number (Dashboard → Auth →
# Providers → Phone → Test OTPs), so no real WhatsApp message is sent.
# Run with: maestro test -e E2E_PHONE=+15005550006 -e E2E_OTP=123456 .maestro
#
# No clearState here: the preceding `onboarding` flow already installed a fresh,
# signed-out app. clearState uninstalls+reinstalls, and that cold-start reinstall
# intermittently crashes the app on CI — so we relaunch the existing install and
# handle the onboarding intro if it shows.
- launchApp
# Signed-out launch shows the onboarding intro; skip straight to sign-in.
- runFlow:
    when:
      visible:
        id: "onboarding-skip"
    commands:
      - tapOn:
          id: "onboarding-skip"
- assertVisible: "Your WhatsApp number"
- tapOn:
    id: "signin-phone-input"
- inputText: ${E2E_PHONE}
- tapOn:
    id: "signin-send-button"
- assertVisible: "Enter the code"
- tapOn:
    id: "signin-otp-input"
- inputText: ${E2E_OTP}
- tapOn:
    id: "signin-verify-button"
# Home = the Me page; the settings gear only exists there.
#
# If this is the assertion you are staring at, check the test-OTP pair BEFORE
# you go looking at Home. A lapsed pair (the dashboard entry carries a
# valid-until date) fails `verify` with 403 otp_expired, which leaves the app on
# the code screen showing `signin-error` — and the first thing that notices is
# this line, 15s later, naming the wrong screen. CI preflights the pair for
# exactly this reason; locally:
#   curl -s -X POST "$SUPABASE_URL/auth/v1/verify" -H "apikey: $ANON_KEY" \
#     -H 'Content-Type: application/json' \
#     -d '{"type":"sms","phone":"'"$E2E_PHONE"'","token":"'"$E2E_OTP"'"}'
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 15000
