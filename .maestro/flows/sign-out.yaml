appId: com.followme.app
name: sign-out
tags:
  - auth
---
# Settings -> Sign out clears the session and returns to the phone sign-in screen.
# Runs LAST in the auth sequence because it tears down the shared session.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-settings-button"
    timeout: 15000
- tapOn:
    id: "home-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-sign-out"
    timeout: 10000
- tapOn:
    id: "settings-sign-out"
- extendedWaitUntil:
    visible:
      id: "signin-phone-input"
    timeout: 15000
