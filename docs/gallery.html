<!DOCTYPE html>
<!--
  Follow Me — public post gallery (GitHub Pages).
  Opened from the WhatsApp message ("See all N photos: …?id=<postId>").
  Fetches the post row + publisher name from Supabase REST with the anon key
  (public by design; posts/publisher_profile have anon SELECT policies).
  Hosted here because Supabase serves Edge Function & Storage HTML as
  text/plain (anti-phishing), so it can't host pages itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photos — Follow Me</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F7F9FB; color: #1A222B; }
    header { padding: 28px 20px 16px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { margin-top: 4px; color: #6B7683; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 0 6px 40px; max-width: 900px; margin: 0 auto; }
    .grid button { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: #E8EDF2; border: 0; padding: 0; cursor: pointer; }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s ease; }
    .grid button:hover img { transform: scale(1.03); }
    .status { text-align: center; padding: 60px 20px; color: #6B7683; font-size: 15px; }
    footer { text-align: center; padding-bottom: 32px; color: #9AA5AE; font-size: 12px; }

    /* Song bar — the posting's soundtrack (issue #54). Mirrors the app's music bar. */
    .song {
      display: none; /* shown by JS when the post has a song */
      align-items: center; gap: 12px;
      max-width: 420px; margin: 0 auto 18px;
      padding: 10px 12px;
      background: #fff; border: 1px solid #E3E9EF; border-radius: 14px;
      text-align: left;
    }
    .song img { width: 44px; height: 44px; border-radius: 10px; background: #E8EDF2; }
    .song .art-fallback {
      width: 44px; height: 44px; border-radius: 10px; background: #EAF3FF;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .song .names { flex: 1; min-width: 0; }
    .song .names a { color: inherit; text-decoration: none; }
    .song .names a:hover { text-decoration: underline; }
    .song .track { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song .artist { font-size: 12px; color: #6B7683; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song button {
      width: 36px; height: 36px; flex: none;
      border: 0; border-radius: 999px;
      background: #1668E3; color: #fff;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .song button:hover { background: #1258C4; }

    /* Lightbox — in-page enlarge instead of navigating to the image URL. */
    .lightbox {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(8, 12, 16, 0.94);
      display: flex; align-items: center; justify-content: center;
      touch-action: pan-y;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      max-width: 100vw; max-height: 100dvh;
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
    }
    .lb-btn {
      position: fixed; z-index: 11;
      background: rgba(255,255,255,0.12); color: #fff;
      border: 0; border-radius: 999px;
      width: 44px; height: 44px;
      font-size: 22px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.22); }
    .lb-close { top: 14px; right: 14px; }
    .lb-prev { left: 10px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 10px; top: 50%; transform: translateY(-50%); }
    .lb-counter {
      position: fixed; z-index: 11; top: 24px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.85); font-size: 14px;
      pointer-events: none;
    }
    @media (max-width: 600px) { .lb-prev, .lb-next { display: none; } } /* swipe instead */
  </style>
</head>
<body>
  <header>
    <h1 id="title">Loading…</h1>
    <p id="subtitle"></p>
  </header>
  <div class="song" id="song"></div>
  <div class="grid" id="grid"></div>
  <p class="status" id="status" hidden></p>
  <footer>Shared with Follow Me</footer>

  <div class="lightbox" id="lightbox" hidden>
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <img id="lbImage" alt="photo">
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://eigvoazyrimzbzcjlscp.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpZ3ZvYXp5cmltemJ6Y2psc2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDEwMjQsImV4cCI6MjA5NjU3NzAyNH0.IS5azZCKMuEnxyZKMPgoV1lePyg4rpvPu8rt1q85yCA';
    const HEADERS = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };

    // Cloudinary display renditions — bounded width, auto format/quality.
    function sizedUrl(url, width) {
      if (!url.includes('/image/upload/') || url.includes('/image/upload/f_')) return url;
      return url.replace('/image/upload/', '/image/upload/f_auto,q_auto:good,w_' + width + '/');
    }
    const thumbUrl = url => sizedUrl(url, 600);
    const fullUrl = url => sizedUrl(url, 2048);

    // ---------- lightbox ----------
    let photoUrls = [];
    let lbIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbCounter = document.getElementById('lbCounter');

    function showPhoto(index) {
      lbIndex = (index + photoUrls.length) % photoUrls.length;
      lbImage.src = fullUrl(photoUrls[lbIndex]);
      lbCounter.textContent = (lbIndex + 1) + ' / ' + photoUrls.length;
      // Warm the neighbours so next/prev feels instant.
      for (const n of [lbIndex + 1, lbIndex - 1]) {
        const i = (n + photoUrls.length) % photoUrls.length;
        new Image().src = fullUrl(photoUrls[i]);
      }
    }

    function openLightbox(index) {
      showPhoto(index);
      lightbox.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.hidden = true;
      lbImage.src = '';
      document.body.style.overflow = '';
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); showPhoto(lbIndex - 1); });
    document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); showPhoto(lbIndex + 1); });
    // Tap outside the photo closes.
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (lightbox.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPhoto(lbIndex - 1);
      if (e.key === 'ArrowRight') showPhoto(lbIndex + 1);
    });

    // Swipe left/right on touch devices.
    let touchStartX = null;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) > 40) showPhoto(lbIndex + (dx < 0 ? 1 : -1));
    }, { passive: true });

    // ---------- song bar (issue #54) ----------
    // The posting's soundtrack: artwork, title/artist and a 30s preview player.
    // All content is inserted via textContent/attributes — never innerHTML —
    // because the song fields come from the database.
    function renderSong(song) {
      if (!song || typeof song.title !== 'string' || typeof song.artist !== 'string') return;
      const bar = document.getElementById('song');

      if (typeof song.artworkUrl === 'string' && song.artworkUrl.startsWith('https://')) {
        const art = document.createElement('img');
        art.src = song.artworkUrl;
        art.alt = '';
        bar.appendChild(art);
      } else {
        const fallback = document.createElement('div');
        fallback.className = 'art-fallback';
        fallback.textContent = '\u{1F3B5}';
        bar.appendChild(fallback);
      }

      const names = document.createElement('div');
      names.className = 'names';
      const track = document.createElement('div');
      track.className = 'track';
      if (typeof song.sourceUrl === 'string' && song.sourceUrl.startsWith('https://')) {
        const link = document.createElement('a');
        link.href = song.sourceUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = song.title;
        track.appendChild(link);
      } else {
        track.textContent = song.title;
      }
      const artist = document.createElement('div');
      artist.className = 'artist';
      artist.textContent = song.artist;
      names.appendChild(track);
      names.appendChild(artist);
      bar.appendChild(names);

      if (typeof song.previewUrl === 'string' && song.previewUrl.startsWith('https://')) {
        const audio = new Audio(song.previewUrl);
        audio.preload = 'none';
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '▶';
        button.setAttribute('aria-label', 'Play song preview');
        function setPlaying(playing) {
          button.textContent = playing ? '⏸' : '▶';
          button.setAttribute('aria-label', playing ? 'Pause song preview' : 'Play song preview');
        }
        button.addEventListener('click', () => {
          if (audio.paused) { audio.play(); setPlaying(true); }
          else { audio.pause(); setPlaying(false); }
        });
        audio.addEventListener('ended', () => setPlaying(false));
        audio.addEventListener('error', () => { button.remove(); });
        bar.appendChild(button);
      }

      bar.style.display = 'flex';
    }

    // ---------- page load ----------
    function fail(message) {
      document.getElementById('title').textContent = 'Follow Me';
      const status = document.getElementById('status');
      status.textContent = message;
      status.hidden = false;
    }

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) return fail('This link is invalid.');

      const postRes = await fetch(
        SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(id) + '&select=publisher_id,media_urls,created_at,song',
        { headers: HEADERS },
      );
      const rows = postRes.ok ? await postRes.json() : [];
      const post = rows[0];
      if (!post) return fail('This post was not found or has expired.');

      let name = 'Your friend';
      try {
        const profRes = await fetch(
          SUPABASE_URL + '/rest/v1/publisher_profile?publisher_id=eq.' + encodeURIComponent(post.publisher_id) + '&select=display_name',
          { headers: HEADERS },
        );
        const profiles = profRes.ok ? await profRes.json() : [];
        if (profiles[0] && profiles[0].display_name) name = profiles[0].display_name;
      } catch (_) { /* keep fallback name */ }

      document.title = name + "'s photos — Follow Me";
      document.getElementById('title').textContent = name + "'s photos \u{1F4F8}";
      const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const count = post.media_urls.length;
      document.getElementById('subtitle').textContent = count + ' photo' + (count === 1 ? '' : 's') + ' · ' + date;

      renderSong(post.song);

      photoUrls = post.media_urls;
      const grid = document.getElementById('grid');
      photoUrls.forEach((url, index) => {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.setAttribute('aria-label', 'View photo ' + (index + 1));
        const img = document.createElement('img');
        img.src = thumbUrl(url);
        img.loading = 'lazy';
        img.alt = 'photo';
        cell.appendChild(img);
        cell.addEventListener('click', () => openLightbox(index));
        grid.appendChild(cell);
      });
    }

    load().catch(() => fail('Something went wrong loading this post.'));
  </script>
</body>
</html>
