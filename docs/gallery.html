<!DOCTYPE html>
<!--
  Follow Me — public post gallery (GitHub Pages).

  Two views over one page, so a follower who opens the WhatsApp link lands on
  the post it points at and can go back to everything else the publisher shared:

    ?id=<postId>    that post, playing as a story (the link's target)
    ?u=<publisher>  the feed — every post as a card, newest first

  Opening a post *is* opening its story — full-screen, first photo, one tap at
  a time. There is no thumbnail grid in between: the cover on the feed card is
  the preview, so a grid would just be a second one.

  Entering on ?id seeds history as [feed, story], so the browser's own back
  button (and the phone's back gesture) reaches the feed without a reload. The
  feed cards mirror the app's PostCard: wide cover, place over date, count chip.

  The story's top-right control is labelled with where it goes ("Omer's posts")
  rather than being a bare ✕: a follower arriving from WhatsApp has no reason to
  guess that closing one post reveals every other one (issue #160).

  The feed is the app's Me page (issue #200): the travel globe fills the screen
  behind a draggable bottom sheet holding the profile and the post cards, with
  the same snap heights (20% / 42% / 84%). The globe's rendering code is not
  written here — docs/globe/ is generated from the app's own sources by
  scripts/build-web-globe.js. Posts with a coordinate become photo markers;
  tapping one opens that post's story.

  Reads Supabase REST with the anon key (public by design; posts and
  publisher_profile have anon SELECT policies). Hosted here because Supabase
  serves Edge Function & Storage HTML as text/plain (anti-phishing), so it
  can't host pages itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photos — Follow Me</title>
  <link rel="stylesheet" href="globe/globe.css">
  <style>
    /* Tokens mirror the app's theme.ts so the web feed reads as the same product. */
    :root {
      color-scheme: light;
      --bg: #F2F5F8;
      --surface-alt: #EEF2F6;
      --text: #13212B;
      --text-secondary: #5A6672;
      --text-muted: #9AA5AE;
      --accent: #0E3A53;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    [hidden] { display: none !important; }
    .page { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
    /* The feed owns the whole viewport (its children are fixed); the section
       itself is just a frame that lets clicks through to the globe. */
    #feedView { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    #feedView > * { pointer-events: auto; }
    .status { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; }
    footer { text-align: center; padding-bottom: 32px; color: var(--text-muted); font-size: 12px; }

    /* ---------- feed view ---------- */
    /* The profile row is the app's Me-sheet header: avatar, name, post count. */
    .profile { display: flex; align-items: center; gap: 14px; padding: 28px 0 20px; }
    .profile-avatar {
      flex: none; width: 62px; height: 62px; border-radius: 999px;
      background: var(--surface-alt); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 24px; font-weight: 700;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-text { min-width: 0; }
    .profile-name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-meta { margin-top: 2px; color: var(--text-secondary); font-size: 14px; }

    /* Card = PostCard.tsx: 16:9 cover, bottom scrim, place over date, count chip. */
    .card {
      display: block; position: relative; width: 100%; aspect-ratio: 16 / 9;
      border: 0; padding: 0; margin-bottom: 12px; cursor: pointer;
      border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-alt);
      -webkit-tap-highlight-color: transparent;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
    .card-caption { position: absolute; left: 16px; right: 16px; bottom: 12px; text-align: left; }
    .card-place { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-date { color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-top: 2px; }
    .card-chip {
      position: absolute; top: 8px; right: 8px;
      display: flex; align-items: center; gap: 3px;
      background: rgba(0,0,0,0.45); color: #fff;
      border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 600;
    }
    /* ---------- no globe (map provider over quota / unreachable) ---------- */
    /* The feed on its own, as it looked before the globe: a plain page with the
       profile and cards, instead of a sheet floating over nothing. */
    body.feed.no-globe { background: var(--bg); overflow: auto; }
    .no-globe #feedView { position: static; pointer-events: auto; }
    .no-globe .globe-hero, .no-globe .app-scrim, .no-globe .sheet-handle-area { display: none; }
    .no-globe .app-header { position: static; padding: 24px 24px 0; margin: 0 auto; max-width: 560px; pointer-events: auto !important; }
    .no-globe .app-header img { filter: none; }
    .no-globe .app-header span { color: var(--accent); }
    .no-globe .sheet {
      position: static; transform: none !important; width: min(100%, 560px); height: auto;
      background: none; box-shadow: none; border-radius: 0; overflow: visible; display: block;
    }
    .no-globe .sheet-body { overflow: visible; padding: 20px 16px 40px; }
    .no-globe .sheet-body .profile { padding: 8px 0 20px; }

    /* ---------- the teaser: planet peeking over the sheet, map loads on demand ---------- */
    /* The page opens on the posts. Only the top of a planet shows above the sheet
       (pure CSS — no map, no tiles), with a pill to open it. The real globe loads
       the first time a follower asks for it, by tapping the pill or dragging the
       sheet down, so people who only came for the photos never cost a map load. */
    .planet-peek {
      position: absolute; left: 50%; top: 104px; width: 150vw; height: 150vw; max-width: 1400px; max-height: 1400px;
      transform: translateX(-50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 50% 8%, #2b6aa6 0%, #12365f 38%, #07152b 70%, #050b18 100%);
      box-shadow: 0 0 0 1px rgba(120,195,255,0.5), 0 0 24px 4px rgba(80,170,255,0.7), 0 0 80px 24px rgba(45,130,245,0.35);
      transition: opacity 500ms ease;
    }
    .globe-hero .globe-stage { opacity: 0; transition: opacity 500ms ease; }
    .globe-hero.ready .globe-stage { opacity: 1; }
    .globe-hero.ready .planet-peek { opacity: 0; }
    .map-pill {
      position: fixed; z-index: 4; left: 50%; bottom: calc(var(--sheet-top-gap, 130px) + 14px);
      transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
      padding: 9px 16px 9px 12px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600;
      color: #fff; cursor: pointer; white-space: nowrap;
      background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.4);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: opacity 250ms ease; -webkit-tap-highlight-color: transparent;
    }
    .map-pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .map-pill.away { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 250ms ease, visibility 0s 250ms; }
    .no-globe .map-pill, .no-globe .planet-peek { display: none; }

    /* ---------- Me page: globe behind a draggable sheet (issue #200) ---------- */
    /* Mirrors HomeScreen: the globe is the background, a header floats over it,
       and the sheet is always SHEET_H tall, slid down with a transform to show
       less of itself — so dragging never triggers layout. */
    body.feed { background: #05070f; overflow: hidden; }
    .globe-hero { position: fixed; inset: 0; z-index: 1; background: #05070f; }
    .globe-hero .globe-stage { position: absolute; inset: 0; }
    .app-scrim {
      pointer-events: none !important; position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 92px;
      background: linear-gradient(rgba(8,12,18,0.55), transparent); pointer-events: none;
    }
    .app-header {
      position: fixed; z-index: 3; top: max(env(safe-area-inset-top), 0px); left: 24px; right: 24px;
      padding-top: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none !important;
    }
    .app-header img { width: 40px; height: 30px; object-fit: contain; filter: brightness(0) invert(1); }
    .app-header span { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .sheet {
      position: fixed; z-index: 5; bottom: 0; left: 0; right: 0; margin: 0 auto;
      width: min(100%, 560px); height: var(--sheet-h, 84vh);
      background: #fff; border-radius: 32px 32px 0 0; overflow: hidden;
      box-shadow: 0 8px 20px rgba(28,27,25,0.1);
      display: flex; flex-direction: column;
      will-change: transform;
    }
    .sheet.settling { transition: transform 320ms cubic-bezier(0.2, 0.9, 0.3, 1.02); }
    .sheet-handle-area {
      flex: none; display: flex; justify-content: center; padding: 12px 0 8px;
      cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .sheet-handle-area:active { cursor: grabbing; }
    .sheet-handle-area:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 16px; }
    .sheet-handle { width: 40px; height: 5px; border-radius: 999px; background: #E2E8F0; }
    /* The sheet is always full height and slid down, so the part below the screen is
       real. The padding (set in placeSheet) lifts the end of the list back into view. */
    .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 24px var(--sheet-inset, 0px); }
    .sheet-body .profile { padding: 0 0 32px; }
    .sheet-body .profile-avatar { width: 64px; height: 64px; border: 2px solid var(--accent); background: #E6EEF3; }
    .sheet-body .profile-name { font-size: 17px; font-weight: 600; letter-spacing: 0; }
    .sheet-body footer { padding: 16px 0 0; }
    .empty { text-align: center; padding: 48px 16px; color: var(--text-secondary); font-size: 14px; }

    /* ---------- story viewer (issue #67) ---------- */
    /* Full-screen, one photo at a time. Mirrors the app's PostingDetailScreen:
       progress segments, tap right/left to advance or go back, place/date on a
       top scrim. */
    .story {
      position: fixed; inset: 0; z-index: 10;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      /* The overlay owns every gesture: a downward drag dismisses it, and
         `pan-y` would hand that to the browser as a scroll — which fires
         touchcancel instead of touchend and swallows the dismiss. */
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .story img {
      max-width: 100vw; max-height: 100dvh;
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform;
    }
    .story-fallback {
      position: absolute; z-index: 11;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 0 32px; text-align: center; color: rgba(255,255,255,0.75);
      font-size: 14px;
    }
    .story-fallback-icon { font-size: 34px; line-height: 1; opacity: 0.7; }
    .story-fallback button {
      background: none; color: #fff; font: inherit; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 999px;
      padding: 8px 18px; cursor: pointer;
    }
    .story-scrim {
      position: fixed; z-index: 11; top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0));
      pointer-events: none;
    }
    .story-top {
      position: fixed; z-index: 12; top: 0; left: 0; right: 0;
      padding: 12px 12px 0;
      pointer-events: none;
    }
    .story-segments { display: flex; gap: 4px; }
    .story-segments span {
      flex: 1; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.35);
    }
    .story-segments span.done { background: #fff; }
    .story-header {
      display: flex; align-items: center; gap: 12px;
      margin-top: 12px;
    }
    .story-titles { flex: 1; min-width: 0; text-align: left; }
    .story-place {
      color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .story-meta {
      color: rgba(255,255,255,0.75); font-size: 11px; font-weight: 600;
      letter-spacing: 1.1px; text-transform: uppercase; margin-top: 2px;
    }
    /* Leaving the story lands on the publisher's feed, not on nothing — a bare
       ✕ read as "dismiss" and hid that (issue #160), so the control names where
       it goes: grid icon, "<name>'s posts", and a chevron for "this navigates". */
    .story-exit {
      pointer-events: auto;
      flex: none; max-width: 55%;
      background: rgba(0,0,0,0.45); color: #fff;
      border: 1px solid rgba(255,255,255,0.28); border-radius: 999px;
      height: 36px; padding: 0 10px 0 12px;
      font: inherit; font-size: 13px; font-weight: 600; letter-spacing: -0.1px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .story-exit-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .story-exit-icon { flex: none; width: 15px; height: 15px; fill: currentColor; }
    .story-exit-chevron { flex: none; opacity: 0.7; font-size: 15px; line-height: 1; }
    .story-exit:hover { background: rgba(255,255,255,0.28); }
  </style>
</head>
<body>
  <div class="page">
    <p class="status" id="status" hidden></p>
  </div>

  <!-- Feed (the app's Me page): every post by the publisher, newest first. -->
  <section id="feedView" hidden>
    <div class="globe-hero" id="globeHero" role="region" aria-label="Map of where these photos were taken">
      <div class="planet-peek" id="planetPeek"></div>
      <div class="globe-stage" id="globeStage"><div class="globe-glow"></div><div class="globe-map"></div></div>
    </div>
    <button class="map-pill" id="mapPill" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
      <span id="mapPillText">See where they’ve been</span>
    </button>
    <div class="app-scrim"></div>
    <div class="app-header"><img src="join/logo.png" alt=""><span>Follow Me</span></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle-area" id="sheetHandle" role="slider" tabindex="0" aria-label="Post list height" aria-orientation="vertical" aria-valuetext="Half open"><div class="sheet-handle"></div></div>
      <div class="sheet-body" id="sheetBody">
        <div class="profile">
          <div class="profile-avatar" id="feedAvatar"></div>
          <div class="profile-text">
            <div class="profile-name" id="feedName"></div>
            <div class="profile-meta" id="feedCount"></div>
          </div>
        </div>
        <div id="feedList"></div>
        <p class="empty" id="feedEmpty" hidden>No posts yet.</p>
        <footer>Shared with Follow Me</footer>
      </div>
    </div>
  </section>
  <div class="story" id="story" hidden>
    <img id="storyImage" alt="photo">
    <!-- Stands in while a photo is arriving, and stays if it never does. The
         <img> is reused across pages, so without this a failed load leaves the
         PREVIOUS photo on screen while the counter says you have moved on. -->
    <div class="story-fallback" id="storyFallback" hidden>
      <div class="story-fallback-icon" id="storyFallbackIcon">◌</div>
      <p id="storyFallbackText"></p>
      <button type="button" id="storyRetry" hidden>Try again</button>
    </div>
    <div class="story-scrim"></div>
    <div class="story-top">
      <div class="story-segments" id="storySegments"></div>
      <div class="story-header">
        <div class="story-titles">
          <div class="story-place" id="storyPlace"></div>
          <div class="story-meta" id="storyMeta"></div>
        </div>
        <!-- The visible text is the accessible name on purpose: a follower
             saying "tap all posts" to voice control has to hit this button. -->
        <button class="story-exit" id="storyExit">
          <svg class="story-exit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="2.5"></rect>
            <rect x="13" y="2.5" width="8.5" height="8.5" rx="2.5"></rect>
            <rect x="2.5" y="13" width="8.5" height="8.5" rx="2.5"></rect>
            <rect x="13" y="13" width="8.5" height="8.5" rx="2.5"></rect>
          </svg>
          <span class="story-exit-label" id="storyExitLabel">All posts</span>
          <span class="story-exit-chevron" aria-hidden="true">›</span>
        </button>
      </div>
    </div>
  </div>

  <script src="globe/globe.js"></script>
  <script>
    // One page, two backends. A post lives in whichever Supabase project
    // created it, and the staging app links here too — this file used to query
    // production only, so every staging post rendered "not found".
    //
    // Anon keys are publishable by design: this page is unauthenticated, and
    // `posts` / `publisher_profile` stay anon-readable through the RLS
    // hardening (20240031) precisely so it can read them.
    const PROJECTS = {
      production: {
        url: 'https://eigvoazyrimzbzcjlscp.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpZ3ZvYXp5cmltemJ6Y2psc2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDEwMjQsImV4cCI6MjA5NjU3NzAyNH0.IS5azZCKMuEnxyZKMPgoV1lePyg4rpvPu8rt1q85yCA',
      },
      staging: {
        url: 'https://xszvrvnxduwpymyabvcg.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzenZydm54ZHV3cHlteWFidmNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDgwNDcsImV4cCI6MjA5ODk4NDA0N30.ey2NHiMJ07q5iwZuVMTWpGjABfHhz6s8XRTiIfhMtVk',
      },
    };

    // Satellite imagery for the globe. The same key the app ships in eas.json:
    // public by nature, so its protection is MapTiler's allowed-origins list
    // (Account → Keys), which must include this site's origin. Empty falls back
    // to MapLibre's free demo tiles — flat land, no imagery.
    const MAPTILER_KEY = 'se9C7mmAnwIVOfBQ6hFP';
    function globeStyleUrl() {
      return MAPTILER_KEY === ''
        ? 'https://demotiles.maplibre.org/style.json'
        : 'https://api.maptiler.com/maps/hybrid/style.json?key=' + encodeURIComponent(MAPTILER_KEY);
    }

    // Repointed by resolveProject() before anything else is fetched.
    let SUPABASE_URL = PROJECTS.production.url;
    let HEADERS = { apikey: PROJECTS.production.key, Authorization: 'Bearer ' + PROJECTS.production.key };

    function useProject(name) {
      const project = PROJECTS[name];
      SUPABASE_URL = project.url;
      HEADERS = { apikey: project.key, Authorization: 'Bearer ' + project.key };
    }

    /**
     * Points the page at the project that actually holds this link's data and
     * returns the probe's rows, so the caller doesn't fetch them twice.
     *
     * `?env=` pins a project outright; otherwise production is tried first and
     * staging second. The fallback is what keeps links that were already sent
     * working — they carry no env marker, and the sender has no way to add one
     * retroactively.
     */
    async function resolveProject(probePath) {
      const forced = new URLSearchParams(location.search).get('env');
      const names = PROJECTS[forced] != null ? [forced] : Object.keys(PROJECTS);
      for (const name of names) {
        useProject(name);
        const rows = await fetchJson(probePath);
        if (rows.length > 0) return rows;
      }
      // Nothing anywhere — report it against the first project we tried.
      useProject(names[0]);
      return [];
    }

    // Cloudinary display renditions — bounded width, auto format/quality.
    function sizedUrl(url, width) {
      if (!url.includes('/image/upload/') || url.includes('/image/upload/f_')) return url;
      return url.replace('/image/upload/', '/image/upload/f_auto,q_auto:good,w_' + width + '/');
    }
    const fullUrl = url => sizedUrl(url, 2048);
    /** Feed covers are one-per-row cards; the app's PostCard asks for the same width. */
    const coverUrl = url => sizedUrl(url, 720);

    /** The label the app's feed shows, e.g. "June 18, 2026". */
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    const feedView = document.getElementById('feedView');
    const statusEl = document.getElementById('status');

    // Publisher + posts, filled by the loaders and reused across views, so
    // going back to the feed (or into another post) costs no round trip.
    let publisherId = null;
    let publisherName = 'Your friend';
    const postsById = new Map();
    let feedRendered = false;
    /** The post the story is playing — history states are keyed on it. */
    let currentPostId = null;

    function fail(message) {
      feedView.hidden = true;
      document.body.classList.remove('feed');
      closeStoryOverlay();
      statusEl.textContent = message;
      statusEl.hidden = false;
    }

    // ---------- story viewer (issue #67) ----------
    // Same interaction model as the app's PostingDetailScreen: segmented
    // progress, tap right/left to advance/go back, swipe, tap past the last
    // photo to close.
    let photoUrls = [];
    let storyIndex = 0;
    let storyDate = '';
    const story = document.getElementById('story');
    const storyImage = document.getElementById('storyImage');
    const storySegments = document.getElementById('storySegments');
    const storyFallback = document.getElementById('storyFallback');
    const storyFallbackIcon = document.getElementById('storyFallbackIcon');
    const storyFallbackText = document.getElementById('storyFallbackText');
    const storyRetry = document.getElementById('storyRetry');
    const storyMeta = document.getElementById('storyMeta');

    /** Fraction of the viewport width that counts as the "go back" tap zone. */
    const BACK_ZONE = 0.3;

    function buildSegments() {
      storySegments.replaceChildren();
      photoUrls.forEach(() => storySegments.appendChild(document.createElement('span')));
    }

    function showFallback(state) {
      const offline = navigator.onLine === false;
      storyFallbackIcon.textContent = state === 'loading' ? '◌' : offline ? '⊘' : '!';
      storyFallbackText.textContent =
        state === 'loading'
          ? 'Loading…'
          : offline
          ? 'This photo isn’t downloaded, and you’re offline.'
          : 'This photo couldn’t be loaded.';
      storyRetry.hidden = state === 'loading';
      storyFallback.hidden = false;
    }

    function showPhoto(index) {
      storyIndex = index;
      const url = fullUrl(photoUrls[storyIndex]);
      // Blanked before the new src is set, not after it arrives: the browser
      // keeps painting the old photo until the new one decodes, so on a dead
      // connection the viewer would sit there showing the previous photo with
      // the counter and progress bar both claiming otherwise.
      storyImage.removeAttribute('src');
      storyImage.style.visibility = 'hidden';
      resetZoom();
      showFallback('loading');
      storyImage.onload = () => {
        storyImage.style.visibility = '';
        storyFallback.hidden = true;
      };
      storyImage.onerror = () => {
        storyImage.style.visibility = 'hidden';
        showFallback('error');
      };
      storyImage.src = url;
      [...storySegments.children].forEach((s, i) => s.classList.toggle('done', i <= storyIndex));
      storyMeta.textContent = storyDate + ' · ' + (storyIndex + 1) + '/' + photoUrls.length;
      // Warm the neighbours so next/prev feels instant.
      for (const n of [storyIndex + 1, storyIndex - 1]) {
        if (n >= 0 && n < photoUrls.length) new Image().src = fullUrl(photoUrls[n]);
      }
    }

    function openStoryOverlay(index) {
      buildSegments();
      showPhoto(index);
      story.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeStoryOverlay() {
      story.hidden = true;
      resetZoom();
      storyImage.removeAttribute('src');
      storyFallback.hidden = true;
      document.body.style.overflow = '';
    }

    // Its own listener, and it stops the click: the overlay's tap zones page
    // forward/back, so a retry that bubbled would also skip the photo it just
    // asked to reload.
    storyRetry.addEventListener('click', e => {
      e.stopPropagation();
      showPhoto(storyIndex);
    });

    document.getElementById('storyExit').addEventListener('click', e => {
      e.stopPropagation();
      closeStory();
    });

    /**
     * Names the story's exit after where it lands — "Omer's posts" rather than
     * a bare ✕ (issue #160). First name only, so the pill stays a pill; the
     * generic "All posts" stands until a display name is actually known.
     */
    function setExitLabel() {
      const first = publisherName.trim().split(/\s+/)[0];
      if (!first) return;
      const owned = first + (/s$/i.test(first) ? "'" : "'s");
      document.getElementById('storyExitLabel').textContent = owned + ' posts';
    }

    // Tap zones — left 30% goes back, the rest advances (mirrors the app).
    // A single tap waits out the double-tap window, so zooming in with a
    // double-tap doesn't also page the story. While zoomed, a lone tap is a
    // no-op (it would otherwise leave the photo you are inspecting).
    let tapTimer = null;
    story.addEventListener('click', e => {
      if (suppressClick) { suppressClick = false; return; }
      if (tapTimer != null) return; // second half of a double-tap; dblclick/touch handles it
      const x = e.clientX;
      tapTimer = setTimeout(() => {
        tapTimer = null;
        if (zoom.scale === 1) step(x < window.innerWidth * BACK_ZONE ? -1 : 1);
      }, DOUBLE_TAP_MS);
    });
    story.addEventListener('dblclick', e => {
      if (tapTimer != null) { clearTimeout(tapTimer); tapTimer = null; }
      toggleZoom(e.clientX, e.clientY);
    });

    document.addEventListener('keydown', e => {
      if (story.hidden) return;
      if (e.key === 'Escape') closeStory();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });

    // ---------- zoom (issue #201) ----------
    // Pinch, double-tap and pan on the current photo. The maths mirrors
    // src/domain/services/photoZoom.ts (the app's copy, which is unit-tested);
    // this page can't import TypeScript, so the two are kept in step by hand.
    const MAX_ZOOM = 4;
    const DOUBLE_TAP_ZOOM = 2.5;
    const DOUBLE_TAP_MS = 260;
    const zoom = { scale: 1, x: 0, y: 0 };
    let suppressClick = false;

    function clampPan(x, y, scale) {
      const maxX = Math.max(0, (window.innerWidth * scale - window.innerWidth) / 2);
      const maxY = Math.max(0, (window.innerHeight * scale - window.innerHeight) / 2);
      return { x: Math.min(maxX, Math.max(-maxX, x)) + 0, y: Math.min(maxY, Math.max(-maxY, y)) + 0 };
    }
    function paintZoom() {
      storyImage.style.transform = zoom.scale === 1
        ? ''
        : 'translate(' + zoom.x + 'px,' + zoom.y + 'px) scale(' + zoom.scale + ')';
      story.classList.toggle('zoomed', zoom.scale > 1);
    }
    function resetZoom() {
      zoom.scale = 1; zoom.x = 0; zoom.y = 0;
      storyImage.style.transition = '';
      paintZoom();
    }
    /** Zoom to `scale` keeping viewport point (cx, cy) under the fingers. */
    function zoomFrom(from, scale, cx, cy) {
      scale = Math.min(MAX_ZOOM, Math.max(1, scale));
      if (scale === 1) { zoom.scale = 1; zoom.x = 0; zoom.y = 0; return; }
      const fx = cx - window.innerWidth / 2;
      const fy = cy - window.innerHeight / 2;
      const ratio = scale / from.scale;
      const p = clampPan(fx - (fx - from.x) * ratio, fy - (fy - from.y) * ratio, scale);
      zoom.scale = scale; zoom.x = p.x; zoom.y = p.y;
    }
    function toggleZoom(cx, cy) {
      storyImage.style.transition = 'transform 180ms ease';
      zoomFrom({ ...zoom }, zoom.scale > 1 ? 1 : DOUBLE_TAP_ZOOM, cx, cy);
      paintZoom();
    }

    // Wheel / trackpad pinch on desktop.
    story.addEventListener('wheel', e => {
      e.preventDefault();
      storyImage.style.transition = '';
      zoomFrom({ ...zoom }, zoom.scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), e.clientX, e.clientY);
      paintZoom();
    }, { passive: false });

    // Mouse drag pans a zoomed photo.
    let mouseDrag = null;
    story.addEventListener('mousedown', e => {
      if (zoom.scale > 1) mouseDrag = { x: e.clientX, y: e.clientY, from: { ...zoom }, moved: false };
    });
    window.addEventListener('mousemove', e => {
      if (mouseDrag == null) return;
      const dx = e.clientX - mouseDrag.x;
      const dy = e.clientY - mouseDrag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) mouseDrag.moved = true;
      const p = clampPan(mouseDrag.from.x + dx, mouseDrag.from.y + dy, zoom.scale);
      zoom.x = p.x; zoom.y = p.y;
      paintZoom();
    });
    window.addEventListener('mouseup', () => {
      if (mouseDrag != null && mouseDrag.moved) suppressClick = true;
      mouseDrag = null;
    });

    // Touch: two fingers pinch, one finger pans while zoomed, and a quick
    // second tap toggles. `gestureZoomed` marks a touch sequence that was a
    // zoom gesture, so its end never also counts as a swipe or a tap.
    let pinch = null;
    let panTouch = null;
    let gestureZoomed = false;
    let lastTouchTap = null;
    const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const touchMid = t => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
    story.addEventListener('touchstart', e => {
      storyImage.style.transition = '';
      if (e.touches.length >= 2) {
        const m = touchMid(e.touches);
        pinch = { dist: touchDist(e.touches), mid: m, from: { ...zoom } };
        panTouch = null;
        gestureZoomed = true;
      } else if (zoom.scale > 1) {
        panTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, from: { ...zoom } };
        gestureZoomed = true;
      }
    }, { passive: true });
    story.addEventListener('touchmove', e => {
      if (pinch != null && e.touches.length >= 2) {
        const m = touchMid(e.touches);
        zoomFrom(pinch.from, pinch.from.scale * touchDist(e.touches) / pinch.dist, pinch.mid.x, pinch.mid.y);
        if (zoom.scale > 1) {
          const p = clampPan(zoom.x + m.x - pinch.mid.x, zoom.y + m.y - pinch.mid.y, zoom.scale);
          zoom.x = p.x; zoom.y = p.y;
        }
        paintZoom();
      } else if (panTouch != null && e.touches.length === 1) {
        const p = clampPan(
          panTouch.from.x + e.touches[0].clientX - panTouch.x,
          panTouch.from.y + e.touches[0].clientY - panTouch.y,
          zoom.scale,
        );
        zoom.x = p.x; zoom.y = p.y;
        paintZoom();
      }
    }, { passive: true });
    story.addEventListener('touchend', e => {
      if (e.touches.length === 1 && pinch != null) {
        // Lifted one finger of a pinch: carry on as a pan from here.
        pinch = null;
        panTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, from: { ...zoom } };
        return;
      }
      if (e.touches.length > 0) return;
      pinch = null;
      panTouch = null;
      // A double-tap, on touch: toggle, and swallow the click it would make.
      if (!gestureZoomed && e.changedTouches.length === 1) {
        const t = e.changedTouches[0];
        const now = Date.now();
        if (lastTouchTap != null && now - lastTouchTap.at < DOUBLE_TAP_MS
            && Math.hypot(t.clientX - lastTouchTap.x, t.clientY - lastTouchTap.y) < 40) {
          lastTouchTap = null;
          if (tapTimer != null) { clearTimeout(tapTimer); tapTimer = null; }
          suppressClick = true;
          if (e.cancelable) e.preventDefault();
          toggleZoom(t.clientX, t.clientY);
          return;
        }
        lastTouchTap = { at: now, x: t.clientX, y: t.clientY };
      } else {
        lastTouchTap = null;
      }
    });

    // Swipe on touch devices: left/right steps through the photos, down
    // dismisses the story for the feed — the gesture every photo viewer has.
    // A real swipe suppresses the tap-zone click (preventDefault on touchend),
    // so one gesture never both steps and taps.
    /** Horizontal travel that counts as a step. */
    const SWIPE_STEP = 40;
    /** Downward travel that dismisses. Higher than a step so a sloppy
     *  horizontal swipe doesn't throw the follower out of the story. */
    const SWIPE_DISMISS = 60;
    let touchStartX = null;
    let touchStartY = null;
    story.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    story.addEventListener('touchcancel', () => {
      touchStartX = null; touchStartY = null; pinch = null; panTouch = null; gestureZoomed = false;
    });
    story.addEventListener('touchend', e => {
      if (e.touches.length > 0) return;
      // A zoom gesture (pinch, or panning while zoomed) is not a swipe: stepping
      // or dismissing here would throw the follower out of the photo they are
      // inspecting. Cleared once every finger is up.
      if (gestureZoomed || zoom.scale > 1) {
        gestureZoomed = false;
        touchStartX = null; touchStartY = null;
        return;
      }
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      // Whichever axis dominates wins, so a diagonal drag does one thing only.
      if (dy > SWIPE_DISMISS && Math.abs(dy) > Math.abs(dx)) {
        e.preventDefault();
        return closeStory();
      }
      if (Math.abs(dx) > SWIPE_STEP && Math.abs(dx) >= Math.abs(dy)) {
        e.preventDefault();
        step(dx < 0 ? 1 : -1);
      }
    });

    // ---------- views ----------
    /** Point the story at a post: photos, and the who/where/when in its header. */
    function loadStory(post) {
      currentPostId = post.id;
      photoUrls = post.media_urls;
      storyDate = formatDate(post.created_at);
      // The story header mirrors the app's: where/when over the photo.
      document.getElementById('storyPlace').textContent = post.place || publisherName;
      document.title = (post.place || publisherName + "'s photos") + ' — Follow Me';
    }

    /** One feed card — the web twin of the app's PostCard. */
    function postCard(post) {
      const date = formatDate(post.created_at);
      const count = post.media_urls.length;

      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.dataset.postId = post.id;
      // The cover is decorative, so without this the card is an unnamed button.
      card.setAttribute(
        'aria-label',
        (post.place ? post.place + ', ' : '') + date + ' — ' + count + ' photo' + (count === 1 ? '' : 's'),
      );

      const cover = post.media_urls[0];
      if (cover) {
        const img = document.createElement('img');
        img.src = coverUrl(cover);
        img.loading = 'lazy';
        img.alt = '';
        card.appendChild(img);
      }

      const scrim = document.createElement('div');
      scrim.className = 'card-scrim';
      card.appendChild(scrim);

      if (count > 1) {
        const chip = document.createElement('div');
        chip.className = 'card-chip';
        chip.textContent = '⧉ ' + count;
        card.appendChild(chip);
      }

      // Place over date, or the date alone when the batch had no location —
      // the same fallback PostCard makes.
      const caption = document.createElement('div');
      caption.className = 'card-caption';
      const place = document.createElement('div');
      place.className = 'card-place';
      place.textContent = post.place || date;
      caption.appendChild(place);
      if (post.place) {
        const dateEl = document.createElement('div');
        dateEl.className = 'card-date';
        dateEl.textContent = date.toUpperCase();
        caption.appendChild(dateEl);
      }
      card.appendChild(caption);

      card.addEventListener('click', () => openPost(post.id));
      return card;
    }

    // ---------- travel globe (issue #200) ----------
    // The same route the app draws: every post that carries a coordinate, oldest
    // first, joined by great-circle legs. The geometry (travelRoute.js) and the
    // renderer (globe.js) are generated from the app's code, not rewritten.
    /** Markers are 54 CSS px; ask the CDN for a 2×-density square, like the app. */
    const MARKER_PX = 108;
    let globe = null;
    let globeLoading = false;
    let globeRouteKey = '';
    let globeDisabled = false;
    /** Set by the first request to see the map — nothing loads before it. */
    let globeWanted = false;
    /** The style answered once; later reveals skip the extra request. */
    let styleChecked = false;

    /**
     * Drops the globe and shows the feed on its own. Used when the map provider
     * is over quota or unreachable: the photos are the product, so a dead map
     * must leave a page that looks finished, not a sheet over black.
     */
    function showWithoutGlobe() {
      globeDisabled = true;
      if (globe != null) { try { globe.remove(); } catch (_) { /* already gone */ } }
      globe = null;
      document.body.classList.add('no-globe');
      document.getElementById('globeHero').hidden = true;
    }
    /**
     * Puts the globe away when the sheet is dragged fully up over it. A map that
     * is still alive keeps drifting and fetching tiles for a planet nobody can
     * see, which is exactly what the quota pays for — so it is torn down, not
     * just covered. Asking for the map again builds a fresh one.
     */
    function putGlobeAway() {
      globeWanted = false;
      if (globe != null) { try { globe.remove(); } catch (_) { /* already gone */ } }
      globe = null;
      globeRouteKey = '';
      document.getElementById('globeStage').replaceChildren(
        Object.assign(document.createElement('div'), { className: 'globe-glow' }),
        Object.assign(document.createElement('div'), { className: 'globe-map' }),
      );
      document.getElementById('globeHero').classList.remove('ready');
    }
    /** HTTP statuses a map provider answers with when a key is out of quota or refused. */
    const MAP_REFUSED = [401, 402, 403, 429];

    function validCoordinate(lat, lon) {
      return typeof lat === 'number' && typeof lon === 'number' &&
        Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    }

    function routeInputs() {
      return [...postsById.values()]
        .filter(post => validCoordinate(post.latitude, post.longitude))
        .map(post => ({
          id: post.id,
          createdAt: post.created_at,
          date: formatDate(post.created_at),
          thumbUrl: post.media_urls[0] ? sizedUrl(post.media_urls[0], MARKER_PX) : null,
          coordinate: { latitude: post.latitude, longitude: post.longitude },
          place: post.place || null,
        }));
    }

    /** Draws the globe, or swaps the new route into the one already drawn. */
    async function syncGlobe() {
      if (globeDisabled) return;
      // The pill's label can be written without the map: how many places there are.
      const places = routeInputs().length;
      document.getElementById('mapPillText').textContent =
        places > 0 ? 'See ' + places + ' place' + (places === 1 ? '' : 's') + ' on the map' : 'See the map';
      if (!globeWanted) return;
      try {
        const { buildTravelRoute } = await import('./globe/travelRoute.js');
        // No located posts is still a globe, as in the app: the planet, no stops.
        const route = buildTravelRoute(routeInputs());
        const key = JSON.stringify(route);
        if (globe != null) {
          if (key !== globeRouteKey) { globeRouteKey = key; globe.setRoute(route); }
          return;
        }
        if (globeLoading) return;
        globeLoading = true;
        // Ask for the style first: an over-quota key answers it with a refusal,
        // and finding out here means the globe is never drawn, rather than
        // drawn black and then removed.
        if (!styleChecked) {
          const styleRes = await fetch(globeStyleUrl());
          if (!styleRes.ok) { globeLoading = false; return showWithoutGlobe(); }
          styleChecked = true;
        }
        await window.loadMapLibre();
        // Put away again while the library was loading: build nothing.
        if (!globeWanted) { globeLoading = false; return; }
        globeRouteKey = key;
        globe = window.createRouteGlobe({
          root: document.getElementById('globeStage'),
          route,
          styleUrl: globeStyleUrl(),
          // The app centres the planet in the band above the resting sheet.
          bottomPadding: sheetSnaps().medium,
          post(message) {
            if (message.type === 'ready') document.getElementById('globeHero').classList.add('ready');
            if (message.type === 'openPosting') openPost(message.id);
            if (message.type === 'error') {
              console.warn('[globe]', message.message);
              // Tiles can run out of quota mid-visit, after the style loaded.
              if (MAP_REFUSED.includes(message.status)) showWithoutGlobe();
            }
          },
        });
        globeLoading = false;
        // Posts may have landed while the library was loading.
        void syncGlobe();
      } catch (_) {
        // The feed is the product; a blocked CDN or no WebGL must not touch it.
        globeLoading = false;
        showWithoutGlobe();
      }
    }

    // ---------- draggable sheet (HomeScreen's) ----------
    // Same model as the app: the sheet is always FULL tall and slid down with a
    // transform to show less of itself, snapping to a peek / the Me-page height /
    // near-full. Only the handle drags; the body scrolls on its own.
    const sheet = document.getElementById('sheet');
    const sheetHandle = document.getElementById('sheetHandle');
    function sheetSnaps() {
      const h = window.innerHeight;
      return { small: Math.round(h * 0.2), medium: Math.round(h * 0.42), full: Math.round(h * 0.84) };
    }
    let sheetVisible = sheetSnaps().medium;   // where it came to rest
    let sheetOffset = 0;                       // current translateY
    const offsetFor = visible => sheetSnaps().full - visible;
    const clampOffset = offset => Math.min(offsetFor(sheetSnaps().small), Math.max(0, offset));

    function placeSheet(visible, animate) {
      const snaps = sheetSnaps();
      sheet.style.setProperty('--sheet-h', snaps.full + 'px');
      sheetVisible = visible;
      sheetOffset = offsetFor(visible);
      sheet.classList.toggle('settling', animate);
      sheet.style.transform = 'translateY(' + sheetOffset + 'px)';
      // Everything below the fold is laid-out sheet, so pad the list past it (and
      // past the phone's home indicator) or the last posts sit off-screen.
      sheet.style.setProperty('--sheet-inset', (sheetOffset + 16) + 'px');
      // The pill rides just above the sheet's top edge, and goes once the map is
      // in view. Asking for the map (any rest below fully open) loads it.
      document.body.style.setProperty('--sheet-top-gap', visible + 'px');
      document.getElementById('globeStage').style.setProperty('--attrib-bottom', visible + 'px');
      document.getElementById('mapPill').classList.toggle('away', visible < sheetSnaps().full - 4);
      if (visible < sheetSnaps().full - 4) wantGlobe();
      else if (globeWanted) putGlobeAway();
      const snapsNow = sheetSnaps();
      sheetHandle.setAttribute('aria-valuetext',
        visible <= snapsNow.small ? 'Peeking' : visible >= snapsNow.full ? 'Fully open' : 'Half open');
    }

    /** First request to see the map: from here on the globe is drawn. */
    function wantGlobe() {
      if (globeWanted) return;
      globeWanted = true;
      void syncGlobe();
    }
    document.getElementById('mapPill').addEventListener('click', () => {
      wantGlobe();
      placeSheet(sheetSnaps().medium, true);
    });

    let grab = null;
    sheetHandle.addEventListener('pointerdown', e => {
      sheetHandle.setPointerCapture(e.pointerId);
      sheet.classList.remove('settling');
      // Grabbing mid-spring continues from where the sheet actually is.
      const live = new DOMMatrix(getComputedStyle(sheet).transform).m42;
      grab = { y: e.clientY, offset: live, t: performance.now(), lastY: e.clientY, lastT: performance.now(), vy: 0 };
    });
    sheetHandle.addEventListener('pointermove', e => {
      if (grab == null) return;
      const now = performance.now();
      if (now > grab.lastT) grab.vy = (e.clientY - grab.lastY) / (now - grab.lastT); // px/ms, down is positive
      grab.lastY = e.clientY; grab.lastT = now;
      sheetOffset = clampOffset(grab.offset + (e.clientY - grab.y));
      sheet.style.transform = 'translateY(' + sheetOffset + 'px)';
      // The ⓘ follows the sheet's edge live while it is being dragged.
      document.getElementById('globeStage').style.setProperty('--attrib-bottom', (sheetSnaps().full - sheetOffset) + 'px');
    });
    function releaseSheet() {
      if (grab == null) return;
      const snaps = sheetSnaps();
      const stops = [snaps.small, snaps.medium, snaps.full];
      const cur = snaps.full - sheetOffset;
      let target;
      // The app's thresholds: a flick (|vy| > 0.5 px/ms) goes to the next snap
      // in its direction, a slow drag to the nearest.
      if (grab.vy < -0.5) target = stops.find(h => h > cur + 4) ?? snaps.full;
      else if (grab.vy > 0.5) target = [...stops].reverse().find(h => h < cur - 4) ?? snaps.small;
      else target = stops.reduce((a, b) => (Math.abs(b - cur) < Math.abs(a - cur) ? b : a));
      grab = null;
      placeSheet(target, true);
    }
    // Keyboard: the handle is a slider, so arrows step through the same snaps.
    sheetHandle.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const snaps = sheetSnaps();
      const stops = [snaps.small, snaps.medium, snaps.full];
      const index = stops.reduce((best, h, i) => (Math.abs(h - sheetVisible) < Math.abs(stops[best] - sheetVisible) ? i : best), 0);
      const next = Math.min(stops.length - 1, Math.max(0, index + (e.key === 'ArrowUp' ? 1 : -1)));
      placeSheet(stops[next], true);
    });
    sheetHandle.addEventListener('pointerup', releaseSheet);
    sheetHandle.addEventListener('pointercancel', releaseSheet);
    window.addEventListener('resize', () => {
      const snaps = sheetSnaps();
      placeSheet(sheetVisible >= snaps.full - 4 ? snaps.full : sheetVisible, false);
      if (globe != null) globe.setBottomPadding(sheetSnaps().medium);
    });

    function renderFeed() {
      const wasHidden = feedView.hidden;
      feedView.hidden = false;
      document.body.classList.add('feed');
      // Opens on the posts; the planet is a teaser until asked for.
      if (wasHidden) placeSheet(sheetSnaps().full, false);
      statusEl.hidden = true;
      document.title = publisherName + ' — Follow Me';

      const posts = [...postsById.values()];
      document.getElementById('feedName').textContent = publisherName;
      document.getElementById('feedCount').textContent =
        posts.length + ' post' + (posts.length === 1 ? '' : 's');
      document.getElementById('feedEmpty').hidden = posts.length > 0;

      void syncGlobe();

      // Cards are rebuilt only when the post set changed; coming back from a
      // post reuses the DOM that is already there.
      if (feedRendered) return;
      const list = document.getElementById('feedList');
      list.replaceChildren();
      posts.forEach(post => list.appendChild(postCard(post)));
      feedRendered = true;
    }

    // ---------- routing ----------
    // Two history entries — feed → story — so the browser back button (and the
    // phone's back gesture) unwinds the way a follower expects: out of the
    // photos, onto the feed. Opening a post *is* opening its story; there is no
    // thumbnail grid in between.
    function feedUrl() { return '?u=' + encodeURIComponent(publisherId); }
    function postUrl(id) { return '?id=' + encodeURIComponent(id); }

    /** The post for an id — from what's loaded, else fetched. Null if it's gone. */
    async function postById(id) {
      const known = postsById.get(id);
      if (known != null) return known;
      const rows = await fetchJson('posts?id=eq.' + encodeURIComponent(id) + '&select=*');
      const post = rows[0];
      if (post == null) {
        fail('This post was not found or has expired.');
        return null;
      }
      postsById.set(post.id, post);
      feedRendered = false;
      return post;
    }

    async function render(state) {
      if (state.v === 'story') {
        const post = await postById(state.id);
        if (post == null) return;
        loadStory(post);
        openStoryOverlay(state.i || 0);
        return;
      }
      closeStoryOverlay();
      renderFeed();
    }

    function go(state, url) {
      history.pushState(state, '', url);
      void render(state);
    }

    /** Tapping a post plays it from the first photo. */
    function openPost(id) { go({ v: 'story', id, i: 0 }, postUrl(id)); }

    /** Advance by delta; stepping past the last photo leaves the story. */
    function step(delta) {
      const next = storyIndex + delta;
      if (next >= photoUrls.length) return closeStory();
      if (next < 0) return;
      showPhoto(next);
      // Replace rather than push: a 30-photo story shouldn't cost 30 backs.
      history.replaceState({ v: 'story', id: currentPostId, i: next }, '', postUrl(currentPostId));
    }

    /**
     * Leave the story for the feed by unwinding history, so the exit button,
     * Escape, and tapping past the last photo all agree with the browser's
     * back button.
     */
    function closeStory() {
      if (history.state != null && history.state.v === 'story') history.back();
      else void render({ v: 'feed' });
    }

    window.addEventListener('popstate', e => {
      void render(e.state || { v: 'feed' });
    });

    // ---------- loading ----------
    async function fetchJson(path) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: HEADERS });
      return res.ok ? await res.json() : [];
    }

    async function loadPublisher() {
      try {
        const profiles = await fetchJson(
          'publisher_profile?publisher_id=eq.' + encodeURIComponent(publisherId) + '&select=display_name,avatar_url',
        );
        const profile = profiles[0];
        if (profile == null || !profile.display_name) return;
        publisherName = profile.display_name;
        setExitLabel();
        const avatar = document.getElementById('feedAvatar');
        if (profile.avatar_url) {
          const img = document.createElement('img');
          img.src = sizedUrl(profile.avatar_url, 200);
          img.alt = '';
          avatar.replaceChildren(img);
        } else {
          avatar.textContent = publisherName.trim().charAt(0).toUpperCase();
        }
      } catch (_) { /* keep the fallback name */ }
    }

    /**
     * Every post by this publisher, newest first. `select=*` rather than a
     * column list on purpose: `place` only exists once migration 20240025 has
     * run, and naming a column the table doesn't have 400s the whole feed.
     *
     * Posts the publisher deleted are absent because the RLS policy filters
     * them (20240032), not because of anything here — same reason no `deleted_at`
     * appears in the query, and it holds for the deep-linked post below too.
     */
    async function loadPosts() {
      const rows = await fetchJson(
        'posts?publisher_id=eq.' + encodeURIComponent(publisherId) + '&select=*&order=created_at.desc&limit=200',
      );
      if (rows.length === 0) return; // keep whatever the deep link already put in the map
      postsById.clear();
      for (const row of rows) postsById.set(row.id, row);
      // A follower can go back before this lands — they'd be looking at a feed
      // holding only the deep-linked post. Redraw it now that the rest is in.
      feedRendered = false;
      if (!feedView.hidden) renderFeed();
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const user = params.get('u');
      if (!id && !user) return fail('This link is invalid.');

      if (id) {
        // Land on the linked post first — it's what the follower tapped — then
        // seed history so back reaches the feed, and fill the feed behind it.
        const rows = await resolveProject('posts?id=eq.' + encodeURIComponent(id) + '&select=*');
        const post = rows[0];
        if (!post) return fail('This post was not found or has expired.');
        publisherId = post.publisher_id;
        postsById.set(post.id, post);

        // Seed [feed, story] as early as the publisher is known, so back works
        // even while the name and the rest of the feed are still loading.
        const opening = { v: 'story', id: post.id, i: 0 };
        history.replaceState({ v: 'feed' }, '', feedUrl());
        history.pushState(opening, '', postUrl(post.id));

        await loadPublisher();
        // Render whatever history says we're on: a follower who hit back
        // during that fetch is on the feed now and must not be yanked back
        // into the photos.
        await render(history.state || opening);

        await loadPosts();
        return;
      }

      publisherId = user;
      // A publisher-feed link carries no post id, so probe on the publisher.
      await resolveProject(
        'publisher_profile?publisher_id=eq.' + encodeURIComponent(user) + '&select=publisher_id&limit=1',
      );
      await loadPublisher();
      await loadPosts();
      history.replaceState({ v: 'feed' }, '', feedUrl());
      renderFeed();
    }

    load().catch(() => fail('Something went wrong loading this post.'));
  </script>
</body>
</html>
