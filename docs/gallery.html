<!DOCTYPE html>
<!--
  Follow Me — public post gallery (GitHub Pages).
  Opened from the WhatsApp message ("See all N photos: …?id=<postId>").
  Fetches the post row + publisher name from Supabase REST with the anon key
  (public by design; posts/publisher_profile have anon SELECT policies).
  Hosted here because Supabase serves Edge Function & Storage HTML as
  text/plain (anti-phishing), so it can't host pages itself.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photos — Follow Me</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F7F9FB; color: #1A222B; }
    header { padding: 28px 20px 16px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { margin-top: 4px; color: #6B7683; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 0 6px 40px; max-width: 900px; margin: 0 auto; }
    .grid button { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: #E8EDF2; border: 0; padding: 0; cursor: pointer; }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .15s ease; }
    .grid button:hover img { transform: scale(1.03); }
    .status { text-align: center; padding: 60px 20px; color: #6B7683; font-size: 15px; }
    footer { text-align: center; padding-bottom: 32px; color: #9AA5AE; font-size: 12px; }

    /* Story viewer (issue #67) — full-screen, one photo at a time. Mirrors the
       app's PostingDetailScreen: progress segments, tap right/left to advance
       or go back, place/date on a top scrim. */
    .story {
      position: fixed; inset: 0; z-index: 10;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      touch-action: pan-y;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .story[hidden] { display: none; }
    .story img {
      max-width: 100vw; max-height: 100dvh;
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
      pointer-events: none;
    }
    .story-scrim {
      position: fixed; z-index: 11; top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0));
      pointer-events: none;
    }
    .story-top {
      position: fixed; z-index: 12; top: 0; left: 0; right: 0;
      padding: 12px 12px 0;
      pointer-events: none;
    }
    .story-segments { display: flex; gap: 4px; }
    .story-segments span {
      flex: 1; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.35);
    }
    .story-segments span.done { background: #fff; }
    .story-header {
      display: flex; align-items: center; gap: 12px;
      margin-top: 12px;
    }
    .story-titles { flex: 1; min-width: 0; text-align: left; }
    .story-place {
      color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .story-meta {
      color: rgba(255,255,255,0.75); font-size: 11px; font-weight: 600;
      letter-spacing: 1.1px; text-transform: uppercase; margin-top: 2px;
    }
    .story-close {
      pointer-events: auto;
      flex: none;
      background: rgba(0,0,0,0.35); color: #fff;
      border: 0; border-radius: 999px;
      width: 36px; height: 36px;
      font-size: 18px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .story-close:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Loading…</h1>
    <p id="subtitle"></p>
  </header>
  <div class="grid" id="grid"></div>
  <p class="status" id="status" hidden></p>
  <footer>Shared with Follow Me</footer>

  <div class="story" id="story" hidden>
    <img id="storyImage" alt="photo">
    <div class="story-scrim"></div>
    <div class="story-top">
      <div class="story-segments" id="storySegments"></div>
      <div class="story-header">
        <div class="story-titles">
          <div class="story-place" id="storyPlace"></div>
          <div class="story-meta" id="storyMeta"></div>
        </div>
        <button class="story-close" id="storyClose" aria-label="Close">✕</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://eigvoazyrimzbzcjlscp.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpZ3ZvYXp5cmltemJ6Y2psc2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDEwMjQsImV4cCI6MjA5NjU3NzAyNH0.IS5azZCKMuEnxyZKMPgoV1lePyg4rpvPu8rt1q85yCA';
    const HEADERS = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };

    // Cloudinary display renditions — bounded width, auto format/quality.
    function sizedUrl(url, width) {
      if (!url.includes('/image/upload/') || url.includes('/image/upload/f_')) return url;
      return url.replace('/image/upload/', '/image/upload/f_auto,q_auto:good,w_' + width + '/');
    }
    const thumbUrl = url => sizedUrl(url, 600);
    const fullUrl = url => sizedUrl(url, 2048);

    // ---------- story viewer (issue #67) ----------
    // Same interaction model as the app's PostingDetailScreen: segmented
    // progress, tap right/left to advance/go back, swipe, tap past the last
    // photo to close.
    let photoUrls = [];
    let storyIndex = 0;
    let storyDate = '';
    const story = document.getElementById('story');
    const storyImage = document.getElementById('storyImage');
    const storySegments = document.getElementById('storySegments');
    const storyMeta = document.getElementById('storyMeta');

    /** Fraction of the viewport width that counts as the "go back" tap zone. */
    const BACK_ZONE = 0.3;

    function buildSegments() {
      storySegments.replaceChildren();
      photoUrls.forEach(() => storySegments.appendChild(document.createElement('span')));
    }

    function showPhoto(index) {
      storyIndex = index;
      storyImage.src = fullUrl(photoUrls[storyIndex]);
      [...storySegments.children].forEach((s, i) => s.classList.toggle('done', i <= storyIndex));
      storyMeta.textContent = storyDate + ' · ' + (storyIndex + 1) + '/' + photoUrls.length;
      // Warm the neighbours so next/prev feels instant.
      for (const n of [storyIndex + 1, storyIndex - 1]) {
        if (n >= 0 && n < photoUrls.length) new Image().src = fullUrl(photoUrls[n]);
      }
    }

    function openStory(index) {
      buildSegments();
      showPhoto(index);
      story.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeStory() {
      story.hidden = true;
      storyImage.src = '';
      document.body.style.overflow = '';
    }

    /** Advance by delta; stepping past the last photo closes the story. */
    function step(delta) {
      const next = storyIndex + delta;
      if (next >= photoUrls.length) return closeStory();
      if (next < 0) return;
      showPhoto(next);
    }

    document.getElementById('storyClose').addEventListener('click', e => {
      e.stopPropagation();
      closeStory();
    });

    // Tap zones — left 30% goes back, the rest advances (mirrors the app).
    story.addEventListener('click', e => {
      step(e.clientX < window.innerWidth * BACK_ZONE ? -1 : 1);
    });

    document.addEventListener('keydown', e => {
      if (story.hidden) return;
      if (e.key === 'Escape') closeStory();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });

    // Swipe left/right on touch devices. A real swipe suppresses the tap-zone
    // click (preventDefault on touchend), so one gesture never steps twice.
    let touchStartX = null;
    story.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    story.addEventListener('touchend', e => {
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) > 40) {
        e.preventDefault();
        step(dx < 0 ? 1 : -1);
      }
    });

    // ---------- page load ----------
    function fail(message) {
      document.getElementById('title').textContent = 'Follow Me';
      const status = document.getElementById('status');
      status.textContent = message;
      status.hidden = false;
    }

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) return fail('This link is invalid.');

      const postRes = await fetch(
        SUPABASE_URL + '/rest/v1/posts?id=eq.' + encodeURIComponent(id) + '&select=publisher_id,media_urls,created_at',
        { headers: HEADERS },
      );
      const rows = postRes.ok ? await postRes.json() : [];
      const post = rows[0];
      if (!post) return fail('This post was not found or has expired.');

      let name = 'Your friend';
      try {
        const profRes = await fetch(
          SUPABASE_URL + '/rest/v1/publisher_profile?publisher_id=eq.' + encodeURIComponent(post.publisher_id) + '&select=display_name',
          { headers: HEADERS },
        );
        const profiles = profRes.ok ? await profRes.json() : [];
        if (profiles[0] && profiles[0].display_name) name = profiles[0].display_name;
      } catch (_) { /* keep fallback name */ }

      document.title = name + "'s photos — Follow Me";
      document.getElementById('title').textContent = name + "'s photos \u{1F4F8}";
      const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const count = post.media_urls.length;
      document.getElementById('subtitle').textContent = count + ' photo' + (count === 1 ? '' : 's') + ' · ' + date;
      // The story header mirrors the app's: who/when over the photo.
      document.getElementById('storyPlace').textContent = name;
      storyDate = date;

      photoUrls = post.media_urls;
      const grid = document.getElementById('grid');
      photoUrls.forEach((url, index) => {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.setAttribute('aria-label', 'View photo ' + (index + 1));
        const img = document.createElement('img');
        img.src = thumbUrl(url);
        img.loading = 'lazy';
        img.alt = 'photo';
        cell.appendChild(img);
        cell.addEventListener('click', () => openStory(index));
        grid.appendChild(cell);
      });
    }

    load().catch(() => fail('Something went wrong loading this post.'));
  </script>
</body>
</html>
