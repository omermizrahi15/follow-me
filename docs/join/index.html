<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3A53" />
    <title>Follow Me — Subscribe</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #F4F6F9;
        color: #13212B;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card {
        width: 100%;
        max-width: 400px;
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 12px 40px rgba(19, 33, 43, 0.08);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
      .brand img { width: 46px; height: auto; display: block; }
      .brand span { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
      h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 6px; }
      .subtitle { color: #5A6672; font-size: 14px; line-height: 20px; margin: 0 0 24px; }
      label { display: block; font-size: 13px; color: #5A6672; margin-bottom: 8px; }
      input {
        width: 100%;
        background: #EEF2F6;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        color: #13212B;
        font-size: 16px;
        padding: 14px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input::placeholder { color: #9AA5AE; }
      input:focus { border-color: #0E3A53; background: #fff; }
      button {
        width: 100%;
        margin-top: 16px;
        background: #0E3A53;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        padding: 15px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover { background: #0A2B40; }
      button:disabled { opacity: 0.5; cursor: default; }
      .msg { font-size: 13px; line-height: 19px; margin: 14px 0 0; }
      .msg.error { color: #E5484D; }
      .success { text-align: center; }
      .success .check {
        width: 64px; height: 64px; margin: 0 auto 16px;
        border-radius: 999px; background: #2BA84A;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 34px;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <section id="form-view">
        <div class="brand">
          <img src="./logo.png" alt="" />
          <span>Follow Me</span>
        </div>
        <h1>Follow along on WhatsApp</h1>
        <p class="subtitle">
          Enter your WhatsApp number to start receiving photos. Reply STOP at any time to unsubscribe.
        </p>
        <form id="join-form" novalidate>
          <label for="phone">Your WhatsApp number</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
                 placeholder="+972 50 123 4567" required />
          <button id="submit" type="submit">Subscribe</button>
          <p class="msg error" id="error" hidden></p>
        </form>
      </section>

      <section id="success-view" class="success" hidden>
        <div class="check">✓</div>
        <h1>You're subscribed!</h1>
        <p class="subtitle">You'll start receiving photos on WhatsApp at <span id="confirmed"></span>.</p>
      </section>
    </main>

    <script>
      // The subscribe edge function (service-role write, no Twilio). Links from
      // the staging app carry ?env=staging so the lookup hits the same Supabase
      // project the publisher signed up in — a staging publisher id doesn't
      // exist in production auth and would read as "invalid link".
      var SUBSCRIBE_URLS = {
        production: 'https://eigvoazyrimzbzcjlscp.supabase.co/functions/v1/subscribe',
        staging: 'https://xszvrvnxduwpymyabvcg.supabase.co/functions/v1/subscribe',
      };
      var params = new URLSearchParams(location.search);
      var publisherId = params.get('p') || '';
      var SUBSCRIBE_URL = SUBSCRIBE_URLS[params.get('env')] || SUBSCRIBE_URLS.production;

      var form = document.getElementById('join-form');
      var phone = document.getElementById('phone');
      var submit = document.getElementById('submit');
      var errorEl = document.getElementById('error');

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
        submit.disabled = false;
        submit.textContent = 'Subscribe';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.hidden = true;
        submit.disabled = true;
        submit.textContent = 'Subscribing…';

        fetch(SUBSCRIBE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ publisherId: publisherId, contactHandle: phone.value }),
        })
          .then(function (resp) { return resp.json().catch(function () { return {}; }).then(function (d) { return { ok: resp.ok, data: d }; }); })
          .then(function (r) {
            if (r.ok && r.data && r.data.ok) {
              document.getElementById('confirmed').textContent = phone.value.trim();
              document.getElementById('form-view').hidden = true;
              document.getElementById('success-view').hidden = false;
              return;
            }
            showError((r.data && r.data.error) || 'Something went wrong. Please try again.');
          })
          .catch(function () { showError('Network error. Please try again.'); });
      });
    </script>
  </body>
</html>
